name: Publish Sisk.Cadente.CoreEngine

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and verify the package without publishing it.
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-sisk-cadente-coreengine
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/publish-nuget
        with:
          project: cadente/Sisk.Cadente.CoreEngine/Sisk.Cadente.CoreEngine.csproj
          package-id: Sisk.Cadente.CoreEngine
          symbols: 'true'
          dry-run: ${{ inputs.dry-run }}
