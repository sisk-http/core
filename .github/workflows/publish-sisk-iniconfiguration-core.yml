name: Publish Sisk.IniConfiguration.Core

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and verify the package without publishing it.
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-sisk-iniconfiguration-core
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/publish-nuget
        with:
          project: extensions/Sisk.IniConfiguration.Core/Sisk.IniConfiguration.Core.csproj
          package-id: Sisk.IniConfiguration.Core
          symbols: 'true'
          dry-run: ${{ inputs.dry-run }}
